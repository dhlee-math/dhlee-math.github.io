            }
        ];
        const presentations = [
                                    {type: 'slide',
                title: "Mutation of Local Floer Chain Complexes across Hamiltonian Bifurcations",
                event: "QSMS 2026 Summer Workshop, Jeju, Korea",
                date: "2026-08",
                link: "Slides/LFC_across_Bifurcation_QSMS_DLee.pdf"
            },
                        {type: 'slide',
                title: "Local Floer Chain Complex across Hamiltonian Bifurcation",
                event: "Geometry Space Surrey, University of Surrey, Guildford, UK",
                date: "2026-06",
                link: "Slides/LFC_across_Bifurcation_Surrey_DLee.pdf"
            },
            {type: 'slide',
                title: "Conley-Zehnder Indices and Bifurcations of the Spatial Rotating Kepler Problem",
                event: "Oyster Dynamics Seminar, Dalian University of Techonology, Dalian, China",
                date: "2026-05",
                link: "Slides/RKP_Dalian_DLee.pdf"
            },
            {
                type: 'slide',
                title: "Bifurcation of Periodic Orbits in Hamiltonian Systems",
                event: "G-Lamp Mathematics Seminar, Soongsil University, Seoul, Korea",
                date: "2026-01",

            },
                        {

            {
                type: 'poster',
                title: "Periodic Orbits of Rotating Kepler Problem : Bifurcation and Conley-Zehnder Indices",
                event: "Celestial Mechanics & N-body Dynamics, Tokyo, Japan",
                date: "2025-11",
                link: "Slides/Tokyo_poster_DonghoLee.pdf"
            },
			{
				type: 'slide',
				title: "Bifurcations of Hamiltonian Periodic Orbits",
				event: "Symplectic Learning Seminar, SNU, Seoul, Korea",

			},
			{
				type: 'slide',

			{

			{

		];
function renderAll() {
    // 날짜 내림차순 정렬 함수
    // TBA나 날짜가 없는 항목은 아래쪽에 배치
    const sortByDateDescending = (a, b) => {
        const dateA = a.date || 'TBA';
        const dateB = b.date || 'TBA';

        if (dateA === 'TBA' && dateB === 'TBA') return 0;
        if (dateA === 'TBA') return 1;
        if (dateB === 'TBA') return -1;

        return new Date(dateB) - new Date(dateA);
    };

    // 논문 리스트 아이템 생성 함수
    const createPubItem = (pub) => {
        const authors = pub.coAuthors
            ? `with ${pub.coAuthors}, `
            : "";

        const venueText = pub.journal || pub.status || "";
        const venue = venueText
            ? `<em>${venueText}</em>`
            : "";

        const dateText = pub.date || "TBA";

        const arxivLink = pub.arxiv
            ? `<a href="https://arxiv.org/abs/${pub.arxiv}"
                  class="text-link"
                  target="_blank"
                  rel="noopener noreferrer">
                   arXiv:${pub.arxiv}
               </a>`
            : "";

        const metadataParts = [
            `${authors}${venue}`,
            dateText,
            arxivLink
        ].filter(part => part);

        const buttons = `
            <span style="margin-left: 8px;">
                ${pub.doi
                    ? `<a href="${pub.doi}"
                          class="tag"
                          target="_blank"
                          rel="noopener noreferrer"
                          style="font-size: 0.75rem; padding: 2px 8px;">
                           DOI
                       </a>`
                    : ""
                }

                ${pub.link
                    ? `<a href="${pub.link}"
                          class="tag"
                          target="_blank"
                          rel="noopener noreferrer"
                          style="font-size: 0.75rem; padding: 2px 8px;">
                           PDF
                       </a>`
                    : ""
                }
            </span>
        `;

        return `
            <li style="margin-bottom: 20px; list-style: none;">
                <div style="display: flex; align-items: center; flex-wrap: wrap;">
                    <strong style="font-size: 1.05rem; color: #000;">
                        ${pub.title}
                    </strong>
                    ${buttons}
                </div>

                <div style="font-size: 0.95rem; color: #444; margin-top: 4px;">
                    ${metadataParts.join(", ")}
                </div>
            </li>
        `;
    };

    // 빈 목록은 출력하지 않는 publication section 생성 함수
    const createPublicationSection = (title, items) => {
        if (items.length === 0) return "";

        const itemsHTML = items
            .map(createPubItem)
            .join("");

        return `
            <h3>${title}</h3>
            <div class="history-card">
                <ul style="padding: 0; margin: 0;">
                    ${itemsHTML}
                </ul>
            </div>
        `;
    };

    // Publications 분류 및 정렬
    const publishedJournals = publications
        .filter(pub => pub.type === "journal")
        .sort(sortByDateDescending);

    const theses = publications
        .filter(pub => pub.type === "thesis")
        .sort(sortByDateDescending);

    const preprints = publications
        .filter(pub => pub.type === "preprint")
        .sort(sortByDateDescending);

    const drafts = publications
        .filter(pub => pub.type === "draft")
        .sort(sortByDateDescending);

    // 학위논문은 Published Papers의 마지막에 배치
    const publishedPapers = [
        ...publishedJournals,
        ...theses
    ];

    document.getElementById("publications-section").innerHTML = `
        <h2>Publications</h2>

        ${createPublicationSection(
            "Published Papers",
            publishedPapers
        )}

        ${createPublicationSection(
            "Preprints",
            preprints
        )}

        ${createPublicationSection(
            "Drafts",
            drafts
        )}
    `;

    // 발표 자료 리스트 생성 함수
    const createPresList = (items, label) => {
        return [...items]
            .sort(sortByDateDescending)
            .map(item => `
                <li style="margin-bottom: 15px; list-style: none;">
                    <div style="display: flex; align-items: center; flex-wrap: wrap;">
                        <strong style="font-size: 1.05rem; color: #000;">
                            ${item.title}
                        </strong>

                        ${item.link
                            ? `<a href="${item.link}"
                                  class="tag"
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  style="margin-left: 8px; font-size: 0.75rem; padding: 2px 8px;">
                                   ${label}
                               </a>`
                            : ""
                        }
                    </div>

                    <div style="font-size: 0.95rem; color: #444; margin-top: 2px;">
                        ${item.event}, ${item.date || "TBA"}
                    </div>
                </li>
            `)
            .join("");
    };

    const slides = presentations.filter(
        presentation => presentation.type === "slide"
    );

    const posters = presentations.filter(
        presentation => presentation.type === "poster"
    );

    document.getElementById("presentations-section").innerHTML = `
        <h2>Presentations</h2>

        <h3>Talks & Slides</h3>
        <div class="history-card">
            <ul style="padding: 0; margin: 0;">
                ${createPresList(slides, "PDF")}
            </ul>
        </div>

        <h3>Posters</h3>
        <div class="history-card">
            <ul style="padding: 0; margin: 0;">
                ${createPresList(posters, "PDF")}
            </ul>
        </div>
    `;
}

	renderAll();
    </script>
