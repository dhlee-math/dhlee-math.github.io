<body>
    <main class="container">
        <header>
            <h1>Papers & Slides</h1>
        </header>

        <section id="publications-section"></section>

        <section id="presentations-section"></section>

        <section>
            <h2>Notes</h2>
            <div class="history-card">
                <p style="margin: 0;">Here are some <a href="Old_Notes/notes.html" class="text-link" target="_blank">old notes</a>.</p>
            </div>
        </section>


		<a href="../index.html" class="back-button">Back to the previous page</a>

    </main>
    <script>
        // 1. 데이터 관리 (여기에 새로운 논문/발표를 추가하세요)
        const publications = [
            {
                type: 'journal',
                title: "Conley-Zehnder Indices of Spatial Rotating Kepler Problem",
                journal: "Journal of Topology and Analysis",
                date: "2026-02",
                doi: "https://www.worldscientific.com/doi/10.1142/S1793525326500238",
                arxiv: "2506.14325",
                summary: "Description of the moduli space and computing the Conley-Zehnder indices of periodic orbits of spatial rotating Kepler problem."
            },
            {
                type: 'journal',
                title: "Global hypersurfaces of section for geodesic flows on convex hypersurfaces",
                coAuthors: "Sunghae Cho",
                journal: "Archiv der Mathematik",
                date: "2024-07",
                doi: "https://link.springer.com/article/10.1007/s00013-024-02018-5",
                arxiv: "2401.02667",
                summary: "Construction of a global hypersurface of section for the geodesic flow with some symmetry."
            },
            {
                type: 'thesis',
                title: "Global Hypersurfaces of Section and the Spatial Kepler Problem",
                journal: "Ph.D. Thesis, Seoul National University",
                date: "2025-02",
                link: "Papers/phD Thesis - Dongho Lee.pdf"
            },
            {
                type: 'draft',
                title: "Fiberwise Convexity of Restricted Three-body Problem",
                status: "In progress",
                coAuthors: "Sunghae Cho and Beomjun Sohn",
				date: "TBA",
                summary: "Investigating fiberwise convexity in the restricted three-body problem, relating it to spatial periodic orbits."
            }
        ];
        const presentations = [
            {
                type: 'slide',
                title: "Bifurcation of Periodic Orbits in Hamiltonian Systems",
                event: "G-Lamp Mathematics Seminar, Soongsil University",
                date: "2026-01",
                link: "Slides/Bifurcation_SSU_DLee.pdf"
            },
            {
                type: 'poster',
                title: "Periodic Orbits of Rotating Kepler Problem : Bifurcation and Conley-Zehnder Indices",
                event: "Celestial Mechanics & N-body Dynamics, Tokyo, Japan",
                date: "2025-11",
                link: "Slides/Tokyo_poster_DonghoLee.pdf"
            },
			{
				type: 'slide',
				title: "Bifurcations of Hamiltonian Periodic Orbits",
				event: "Symplectic Learning Seminar, SNU",
				date: "2025-12",
				link: "Slides/Bifurcation.pdf"
			},
			{
				type: 'slide',
				title: "Hamiltonian Dynamics and Three-body Problem",
				event: "Rookie's Pitch, SNU",
				date: "2025-10",
				link: "Slides/Hamiltonian Dynamics and Three-body Problem - Dongho Lee.pdf"
			},
			{
				type: 'slide',
				title: "Three-body Problem and Related Problems",
				event: "QSMS 2025 Summer Workshop, Goseong, Korea",
				date: "2025-08",
				link: "Slides/Three-body problem and Related Problems - Dongho Lee.pdf"
			},
			{
				type: 'slide',
				title: "Billiards and Quantitative Symplectic Geometry",
				event: "Heidelberg University, Germany",
				date: "2025-07",
				link: "Slides/Periodic Orbits of RKP - Dongho Lee.pdf"
			},
			{
				type: 'slide',
				title: "Periodic Orbits of Spatial Kepler Problem",
				event: "2025 Korean Mathematical Society Spring Meeting, Daejeon, Korea",
				date: "2025-08",
				link: "Slides/Periodic Orbits of Spatial Kepler Problem - Dongho Lee.pdf"
			},
			{
				type: 'slide',
				title: "Spatial Kepler Problem",
				event: "Thesis defense, SNU",
				date: "2024-12",
				link: "Slides/Spatial Kepler Problem - Dongho Lee.pdf"
			},
			{
				type: 'slide',
				title: "Global Hypersurfaces of Section",
				event: "Thesis defense, SNU",
				date: "2024-12",
				link: "Slides/Global Hypersurfaces of Section - Dongho Lee.pdf"
			}
		];
function renderAll() {
            // --- [Publications 렌더링] ---
            const pubItems = publications.map(pub => {
                const authors = pub.coAuthors ? `with ${pub.coAuthors}, ` : "";
                const venue = pub.journal ? `<em>${pub.journal}</em>` : `<em>${pub.status}</em>`;
                const arxivLink = pub.arxiv ? `, <a href="https://arxiv.org/abs/${pub.arxiv}" class = "text-link" target="_blank">arXiv:${pub.arxiv}</a>` : "";
                
                // 버튼 생성 (링크가 있는 경우만 생성)
                const buttons = `
                    <span style="margin-left: 8px;">
                        ${pub.doi ? `<a href="${pub.doi}" class="tag" target="_blank" style="font-size: 0.75rem; padding: 2px 8px;">DOI</a>` : ''}
                        ${pub.link ? `<a href="${pub.link}" class="tag" target="_blank" style="font-size: 0.75rem; padding: 2px 8px;">PDF</a>` : ''}
                    </span>
                `;

                return `
                    <li style="margin-bottom: 20px; list-style: none;">
                        <div style="display: flex; align-items: center; flex-wrap: wrap;">
                            <strong style="font-size: 1.05rem; color: #000;">${pub.title}</strong>
                            ${buttons}
                        </div>
                        <div style="font-size: 0.95rem; color: #444; margin-top: 4px;">
                            ${authors}${venue}, ${pub.date || 'TBA'}${arxivLink}
                        </div>
                    </li>
                `;
            }).join('');

            document.getElementById('publications-section').innerHTML = `
                <h2>Publications</h2>
                <div class="history-card"><ul style="padding: 0; margin: 0;">${pubItems}</ul></div>
            `;

            // --- [Presentations 렌더링] ---
            const createList = (items, label) => items
                .sort((a, b) => (a.date === 'TBA' ? 1 : b.date === 'TBA' ? -1 : new Date(b.date) - new Date(a.date)))
                .map(item => `
                    <li style="margin-bottom: 15px; list-style: none;">
                        <div style="display: flex; align-items: center; flex-wrap: wrap;">
                            <strong style="font-size: 1.05rem; color: #000;">${item.title}</strong>
                            <a href="${item.link}" class="tag" target="_blank" style="margin-left: 8px; font-size: 0.75rem; padding: 2px 8px;">${label}</a>
                        </div>
                        <div style="font-size: 0.95rem; color: #444; margin-top: 2px;">
                            ${item.event}, ${item.date}
                        </div>
                    </li>
                `).join('');

            const slides = presentations.filter(p => p.type === 'slide');
            const posters = presentations.filter(p => p.type === 'poster');

            document.getElementById('presentations-section').innerHTML = `
                <h2>Presentations</h2>
                <h3>Talks & Slides</h3>
                <div class="history-card"><ul style="padding: 0; margin: 0;">${createList(slides, 'Slides')}</ul></div>
                <h3>Posters</h3>
                <div class="history-card"><ul style="padding: 0; margin: 0;">${createList(posters, 'Poster')}</ul></div>
            `;
        }

        renderAll();
    </script>
</body>
</html>
