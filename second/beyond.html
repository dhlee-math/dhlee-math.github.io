// --- [렌더링 로직 수정본] ---
function renderPersonal() {
    const container = document.getElementById('personal-list');
    container.innerHTML = personalData.map(categoryBox => `
        <div class="history-card">
            <div class="card-meta">${categoryBox.category}</div>
            
            ${categoryBox.subItems.map((item, index) => `
                <div style="${index > 0 ? 'border-top: 1px solid #eee; margin-top: 25px; padding-top: 20px;' : ''}">
                    <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px;">
                        <strong style="font-size: 1.1rem; color: var(--primary-color);">${item.title}</strong>
                        ${item.tags ? item.tags.map(tag => `
                            <a href="${tag.link}" class="tag" target="_blank" style="font-size: 0.75rem; padding: 2px 8px;">${tag.name}</a>
                        `).join('') : ''}
                    </div>
                    
                    <p style="font-size: 0.95rem; color: #444; margin: 8px 0 12px 0; line-height: 1.5;">
                        ${item.description}
                    </p>

                    ${item.bestList && item.bestList.length > 0 ? `
                        <div style="background: #fcfcfc; padding: 12px; border-radius: 6px; border: 1px solid #f0f0f0;">
                            <span style="font-size: 0.8rem; font-weight: 800; color: #888; letter-spacing: 0.5px;">
                                ${item.bestTitle ? item.bestTitle.toUpperCase() : 'BEST LIST'}
                            </span>
                            <ul style="margin-top: 8px; font-size: 0.95rem; color: #444; list-style-type: none; padding: 0;">
                                ${item.bestList.map(li => `
                                    <li style="margin-bottom: 4px; padding-left: 15px; position: relative;">${li}</li>
                                `).join('')}
                            </ul>
                        </div>
                    ` : ''}
                </div>
            `).join('')}
        </div>
    `).join('');
}
